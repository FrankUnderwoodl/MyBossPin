zookeeper:
  curator:
    #    host: 192.168.1.121:2181,192.168.1.122:2181,192.168.1.123:2181   集群模式
    host: localhost:2181                     # 单机模式
    connectionTimeoutMs: 30000               # 连接超时时间，单位毫秒
    sessionTimeoutMs: 3000                   # 会话超时时间，单位毫秒
    sleepMsBetweenRetry: 2000                # 重试间隔时间，单位毫秒
    maxRetries: 3                            # 最大重试次数
    namespace: curator-mybosspin             # 命名空间，类似于MQ中的Virtual Host

