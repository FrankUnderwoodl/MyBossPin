spring:
  cloud:
    nacos:
      discovery:
        server-addr: http://localhost:8848 # Nacos注册中心的地址
        namespace: decf67bc-7840-4ed9-a65b-6523ffc0fda1 # Nacos的命名空间，我不使用默认的命名空间，而是使用自定义的命名空间

seata:
  # Seata分布式事务的开关
  enabled: true
  tx-service-group: mybosspin_tx_group # Seata事务组的名称

  # Seata的配置
  service:
    # Seata服务的配置
    vgroup-mapping:  # 事务组名称与Seata服务组的映射关系
      mybosspin_tx_group: SEATA_GROUP # 事务组名称与Seata服务组的映射关系
    grouplist:  # Seata服务组的列表
      SEATA_GROUP: localhost:8091 # Seata服务组的地址，通常是Seata TC（事务协调器）的地址

  config:
    nacos:
      server-addr: localhost:8848
      namespace: decf67bc-7840-4ed9-a65b-6523ffc0fda1 # Nacos的命名空间
      username: nacos
      password: nacos
  registry:
    nacos:
      server-addr: localhost:8848 # Nacos注册中心的地址
      namespace: decf67bc-7840-4ed9-a65b-6523ffc0fda1 # Nacos的命名空间
      username: nacos
      password: nacos


