server:
#  servlet:
#    context-path: /mybosspin # 设置应用的上下文路径
  port: ${port:7001} # 设置应用的端口，默认为7001
  tomcat:
    uri-encoding: utf-8 # 设置URI编码为UTF-8，也就是支持中文路径
    max-swallow-size: -1 # -1的意思是不限制，也就是上传的文件大小不限制

spring:
  application:
    name: user-service # 设置应用名称为user-service
  profiles:
    active: dev # 设置当前激活的配置文件为dev

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      #      banner: false
      update-strategy: not_empty
  mapper-locations: classpath:/mapper/*.xml

# 分页插件助手的配置
pagehelper:
  helper-dialect: MYSQL
  support-methods-arguments: true

# 日志级别
logging:
  level:
    root: info

