spring:
  datasource:                                     # 数据源的相关配置
    type: com.zaxxer.hikari.HikariDataSource      # 数据源的类型，可以更改为其他的数据源配置，比如druid
    driver-class-name: com.mysql.cj.jdbc.Driver      # mysql/MariaDB 的数据库驱动类名称
    url: jdbc:mysql://localhost:3306/mybosspin?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 33321480
    hikari:
      connection-timeout: 30000               # 等待连接池分配连接的最大时间（毫秒），超过这个时长还没有可用的连接，则会抛出SQLException，这里是30秒
      minimum-idle: 5                         # 最小连接数
      maximum-pool-size: 20                   # 最大连接数
      auto-commit: true                       # 自动提交
      idle-timeout: 600000                    # 连接超时的最大时长（毫秒），超时则会被释放（retired）
      pool-name: DataSourceHikariCP           # 连接池的名字
      max-lifetime: 18000000                  # 连接池的最大生命时长（毫秒），超时则会被释放（retired），这里是5小时
      connection-test-query: SELECT 1         # 连接测试查询语句，HikariCP会使用这个语句来测试连接是否有效

  cloud:
    nacos:
      discovery:
        server-addr: http://localhost:8848 # Nacos注册中心的地址
        namespace: decf67bc-7840-4ed9-a65b-6523ffc0fda1 # Nacos的命名空间，我不使用默认的命名空间，而是使用自定义的命名空间

  redis:
    host: localhost
    port: 6379
    password: 33321480
    database: 0

  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /
    username: Lzm
    password: 33321480
    listener:
      simple: # simple表示使用简单的监听器容器(阻塞式)，direct表示使用DirectMessageListenerContainer(非阻塞式)
        acknowledge-mode: MANUAL # 手动确认消息,也就是可以反馈信息给 RabbitMQ 是否该消息被消费了
        # 每次从队列中获取的消息数量，直到你手动ack消息之后，才会继续从queue中获取消息。建议设置这个属性，因为如果不设置，RabbitMQ会一次性将所有的消息都推送给消费者，这样会导致消费者处理不过来，可能会导致消费者的内存溢出或者处理速度变慢。
        prefetch: 2


#    password: ENC(gbVcyVXncfqM8dRR6mpio+5JYji57rdQ)

